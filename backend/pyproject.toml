[project]
name = "backend"
version = "0.1.0"
description = "FastAPI + DynamoDB API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "uvicorn-worker>=0.2",
    "aioboto3>=13.0",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "moto[server]>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

# The SQS worker is a separate deployable on top of the same codebase.
worker = [
    "deepgram-sdk>=3.0",
    "google-genai>=1.0",
    "json-repair>=0.40",
    # Shifts the transcript's ASS track to the start of each rendered segment.
    "pysubs2>=1.7",
    # A real ffmpeg binary from a wheel, for hosts that cannot install system packages.
    "static-ffmpeg>=2.5",
]

[tool.uv]
# This is an application, not a library: nothing installs or imports it as a package.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["instructions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["instructions/", "tests/"]

[[tool.mypy.overrides]]
module = ["aioboto3.*", "aiobotocore.*", "boto3", "boto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The worker SDKs do not ship usable typing; the wrapper code treats them as Any.
module = [
    "deepgram",
    "deepgram.*",
    "google",
    "google.*",
    "genai",
    "genai.*",
    "json_repair",
    "pysubs2",
    "pysubs2.*",
    "static_ffmpeg",
    "static_ffmpeg.*",
]
ignore_missing_imports = true